/* ---------- Cart ---------- */
function vCart(){const pid=S.cart;
  if(!pid||!S.plans[pid])return `<div class="page-head"><div><p class="eyebrow">Cart</p><h1>Registration cart</h1></div></div>
    <div class="empty"><b>Your cart is empty.</b><p class="small" style="margin-top:6px">Open a plan and choose <b>Send to cart</b> when it has no clashes.</p><p style="margin-top:14px"><button class="btn btn-primary" data-action="open-plan" data-pid="${S.main}">Open ${esc(planName(S.main))}</button></p></div>`;
  const map=mapOf(pid),es=entries(map),cr=credits(map),cl=clashes(map),bh=blockHits(map),fu=fulls(map),bad=es.filter(e=>!e.c.elig);
  const checks=[
   [bad.length?'no':'ok',bad.length?`${bad.length} course(s) missing a prerequisite`:'All prerequisites met'],
   [cl.length?'no':'ok',cl.length?`${cl.length} time clash${cl.length>1?'es':''}`:'No time clashes'],
   [bh.length?'no':'ok',bh.length?`${bh.length} class(es) overlap your blocked time`:(S.blocks.length?'Your blocked time is free':'No blocked time set')],
   [cr>MAX_LOAD?'no':cr<3?'warn':'ok',`${cr} of ${MAX_LOAD} maximum credits`],
   ...fu.map(e=>['warn',`${e.c.code} ${e.sid} is full · you'll join the waitlist (#${(e.s.wait||0)+1})`]),
   ['info',`Enrolment opens ${ENROL_OPENS}`]];
  const blocking=bad.length||cl.length||bh.length||cr>MAX_LOAD;
  const rows=es.map(e=>`<tr><td><div class="row" style="gap:8px;flex-wrap:nowrap">${chip(e.c,true)}<b>${e.c.code}</b></div><div class="small muted">${esc(e.c.title)}</div></td><td>${e.sid}</td><td>${meetText(e.s)}</td><td>${esc(e.s.prof)}</td><td class="num">${e.c.cr}</td></tr>`).join('');
  return `<div class="page-head"><div><p class="eyebrow">Cart · Winter 2027</p><h1>${esc(planName(pid))} is in your cart</h1><p class="sub">This is what you will register for when enrolment opens.</p></div>
    <div class="row"><button class="btn" data-action="open-plan" data-pid="${pid}">Edit plan</button><button class="btn btn-ghost" data-action="cart-remove">Remove from cart</button></div></div>
  <div class="grid-2"><section class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Course</th><th>Section</th><th>When</th><th>Instructor</th><th class="num">Credits</th></tr></thead><tbody>${rows}
    <tr><td colspan="4"><b>Total</b></td><td class="num"><b>${cr}</b></td></tr></tbody></table></div></section>
   <section class="panel"><h2 style="margin-bottom:12px">Ready to register?</h2><ul class="checklist">${checks.map(([k,t])=>`<li><span class="mark ${k}">${k==='ok'?'✓':k==='no'?'✗':k==='warn'?'!':'i'}</span><span>${esc(t)}</span></li>`).join('')}</ul>
    <div class="addbar" style="flex-direction:column;align-items:stretch">
     <button class="btn btn-primary" aria-disabled="true" data-action="blocked" data-reason="${esc(blocking?'Fix the problems marked ✗ first. Registration also opens '+ENROL_OPENS+'.':'Registration opens '+ENROL_OPENS+'.')}">Register now</button>
     <p class="small muted" style="text-align:center">${blocking?'Fix the items marked ✗ first.':'Opens '+ENROL_OPENS}</p>
     <label class="check" style="justify-content:center"><input type="checkbox" data-change="remind" ${S.remind?'checked':''}><span>Remind me 15 minutes before enrolment opens</span></label></div></section></div>`;}

/* ================= LAYERS ================= */
function renderLayer(){const L=ui.layer,el=$('#layer');if(!L){el.innerHTML='';return;}
  if(L.type==='secs'){const c=C[L.cid],pid=S.active,cur=mapOf(pid)[c.id],sel=L.sel||cur||null;
    let btn;if(!c.elig)btn=`<button class="btn btn-primary" aria-disabled="true" data-action="blocked" data-reason="${esc(c.code+': '+eligReason(c))}">Add</button>`;
    else if(!sel)btn=`<button class="btn btn-primary" aria-disabled="true" data-action="blocked" data-reason="Pick a section first.">Add to ${esc(planName(pid))}</button>`;
    else if(sel===cur)btn=`<button class="btn btn-primary" aria-disabled="true" data-action="blocked" data-reason="${sel} is already in ${esc(planName(pid))}.">Keep ${sel}</button>`;
    else btn=`<button class="btn btn-primary" data-action="apply-sec" data-cid="${c.id}" data-sid="${sel}" data-pid="${pid}">${cur?'Switch to '+sel:'Add '+sel+' to '+esc(planName(pid))}</button>`;
    el.innerHTML=`<div class="scrim" data-action="close-layer"></div><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <div class="drawer-head">${chip(c)}<div style="flex:1;min-width:0"><p class="eyebrow">${cur?'Change section':'Choose a section'} · ${esc(planName(pid))}</p><h2 id="dTitle">${c.code} · ${esc(c.title)}</h2><p class="small muted">${c.cr} credits · ${REQ[c.req].name}</p></div><button class="close" data-action="close-layer" aria-label="Close">✕</button></div>
      <div class="drawer-body"><p class="small muted" style="margin-bottom:12px">Greyed sections clash with your plan or your blocked time. The reason is shown under each one.</p>
       <div class="secs" role="radiogroup" aria-label="Sections">${c.sections.map(s=>secRow(c,s,pid,sel===s.id,cur===s.id)).join('')}</div>
       <p style="margin-top:14px"><button class="link" data-action="go" data-to="course-${c.id.toLowerCase()}">See full course details</button></p></div>
      <div class="drawer-foot">${cur?`<button class="btn btn-ghost" data-action="remove-course" data-cid="${c.id}">Remove from plan</button><span class="spacer"></span>`:''}<button class="btn" data-action="close-layer">Cancel</button>${btn}</div></div>`;
    focusFirst();return;}
  if(L.type==='block'){const F=ui.blockForm;const times=[];for(let t=T0;t<=T1;t+=30)times.push(fmt(t));
    el.innerHTML=`<div class="scrim" data-action="close-layer"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="bTitle">
     <div class="drawer-head"><div style="flex:1"><p class="eyebrow">Block time</p><h2 id="bTitle">Keep time free for work, commuting or anything else</h2></div><button class="close" data-action="close-layer" aria-label="Close">✕</button></div>
     <form class="drawer-body" id="blockForm" novalidate>
      <div class="field"><label for="bLabel">What is it?</label><input type="text" id="bLabel" value="${esc(F.label)}" maxlength="24"></div>
      <div class="field"><span class="lbl" id="bDaysLbl">Days</span><div class="days" role="group" aria-labelledby="bDaysLbl">${DAYS.map(d=>`<button type="button" class="day-tog" aria-pressed="${F.days.includes(d)}" data-action="block-day" data-d="${d}">${d}</button>`).join('')}</div></div>
      <div class="row"><div class="field" style="flex:1"><label for="bStart">From</label><select id="bStart">${times.slice(0,-1).map(t=>`<option ${t===F.s?'selected':''}>${t}</option>`).join('')}</select></div>
       <div class="field" style="flex:1"><label for="bEnd">To</label><select id="bEnd">${times.slice(1).map(t=>`<option ${t===F.e?'selected':''}>${t}</option>`).join('')}</select></div></div>
      <p id="bMsg" class="small muted" aria-live="polite"></p></form>
     <div class="drawer-foot"><button class="btn" data-action="close-layer">Cancel</button><button class="btn btn-primary" data-action="save-block">Block this time</button></div></div>`;
    blockPreview();['bLabel','bStart','bEnd'].forEach(id=>$('#'+id).addEventListener('input',()=>{readBlockForm();blockPreview();}));
    $('#blockForm').addEventListener('submit',e=>{e.preventDefault();saveBlock();});focusFirst();}}
function focusFirst(){setTimeout(()=>{const f=$('#layer [role=dialog] input, #layer [role=dialog] .sec-pick:not([aria-disabled]), #layer [role=dialog] .close');if(f)f.focus();},0);}
function readBlockForm(){const F=ui.blockForm;F.label=$('#bLabel').value;F.s=$('#bStart').value;F.e=$('#bEnd').value;}
function blockPreview(){const F=ui.blockForm,msg=$('#bMsg');if(!msg)return;
  if(!F.days.length){msg.innerHTML='Pick at least one day.';return;}
  if(tm(F.e)<=tm(F.s)){msg.innerHTML='<span class="err">“To” must be later than “From”.</span>';return;}
  const b={days:F.days,s:F.s,e:F.e,label:F.label||'Busy'};const hits=[];S.order.forEach(p=>entries(mapOf(p)).forEach(e=>{if(blockOvl(e.s,b).length)hits.push(S.plans[p].name+': '+e.c.code+' '+e.sid);}));
  msg.innerHTML=`Blocks <b>${F.days.join(', ')} ${F.s}–${F.e}</b>. Sections at these times will be greyed out.`+(hits.length?`<br><span class="err">Already overlaps: ${esc(hits.join(' · '))}</span>`:'');}
function saveBlock(){readBlockForm();const F=ui.blockForm;
  if(!F.days.length){toast('Pick at least one day.',{err:true});logErr('Block time: no day picked');return;}
  if(tm(F.e)<=tm(F.s)){toast('“To” must be later than “From”.',{err:true});logErr('Block time: end before start');return;}
  const lab=(F.label||'Busy').trim()||'Busy';ui.layer=null;
  commit(()=>{S.blocks.push({id:S.nextBlock++,label:lab,days:F.days.slice(),s:F.s,e:F.e});},`Blocked ${F.days.join(', ')} ${F.s}–${F.e} for “${lab}”`);}

/* ================= ACTIONS ================= */
function act(a,el,e){const d=el.dataset;
  switch(a){
  case 'go':ui.menu=null;go(d.to);break;
  case 'menu':ui.menu=ui.menu===d.menu?null:d.menu;renderNav();break;
  case 'nyi':ui.menu=null;renderNav();notInPrototype(d.what);break;
  case 'undo':if(hist.length){S=JSON.parse(hist.pop());save();render();toast('Undone');logEv('undo','');}break;
  case 'toast-close':el.closest('.toast').remove();break;
  case 'blocked':toast(d.reason||'Not available right now.',{err:true});logErr('Tried: '+(el.textContent.trim())+' — '+(d.reason||''));break;
  case 'rmp':toast('Would open '+d.prof+'’s Rate My Professors page in a new tab (not connected in this prototype).');logEv('click','RMP '+d.prof);break;
  case 'open-plan':S.active=d.pid;save();go('timetable');break;
  case 'set-active':S.active=d.pid;save();render();break;
  case 'find-unmet':ui.f.req={core3:true,core4:false,elec:true};ui.f.elig=true;go('search');break;
  case 'clear-filters':ui.f={req:{core3:false,core4:false,elec:false},fits:false,nofri:false,seats:false,elig:false,r4:false};ui.q='';render();break;
  case 'open-secs':ui.layer={type:'secs',cid:d.cid,sel:null};renderLayer();break;
  case 'pick-sec':{if(el.getAttribute('aria-disabled')==='true'){toast(d.reason,{err:true});logErr('Picked greyed section '+d.cid+' '+d.sid+': '+d.reason);break;}
    if(ui.layer&&ui.layer.type==='secs'){ui.layer.sel=d.sid;renderLayer();}else{ui.detailSel[d.cid]=d.sid;render();}break;}
  case 'apply-sec':{const pid=d.pid,c=C[d.cid],cur=mapOf(pid)[d.cid];clashBefore=clashes(mapOf(pid)).length+blockHits(mapOf(pid)).length;ui.layer=null;delete ui.detailSel[d.cid];
    commit(()=>{S.plans[pid].sections[d.cid]=d.sid;},cur?`Switched ${c.code} to ${d.sid} in ${planName(pid)}`:`Added ${c.code} ${d.sid} to ${planName(pid)}`,{checkClash:pid});break;}
  case 'remove-course':{const pid=S.active,c=C[d.cid];ui.layer=null;commit(()=>{delete S.plans[pid].sections[d.cid];},`Removed ${c.code} from ${planName(pid)}`);break;}
  case 'close-layer':ui.layer=null;renderLayer();break;
  case 'open-block':ui.blockForm={label:'Work',days:[],s:'18:00',e:'22:00'};ui.layer={type:'block'};renderLayer();break;
  case 'block-day':{readBlockForm();const F=ui.blockForm,i=F.days.indexOf(d.d);if(i>=0)F.days.splice(i,1);else F.days.push(d.d);F.days.sort((x,y)=>DAYS.indexOf(x)-DAYS.indexOf(y));
    el.setAttribute('aria-pressed',i<0);blockPreview();break;}
  case 'save-block':saveBlock();break;
  case 'del-block':{const b=S.blocks.find(x=>x.id==d.id);commit(()=>{S.blocks=S.blocks.filter(x=>x.id!=d.id);},`Removed “${b.label}” on ${b.days.join(', ')}`);break;}
  case 'dup-plan':{const src=S.active,id=String.fromCharCode(65+S.order.length);if(S.order.length>=6){toast('You can keep up to 6 plans.',{err:true});break;}
    commit(()=>{S.plans[id]={name:'Plan '+id,sections:Object.assign({},mapOf(src))};S.order.push(id);S.active=id;},`Created Plan ${id} as a copy of ${planName(src)}`);break;}
  case 'make-main':commit(()=>{S.main=d.pid;},`${planName(d.pid)} is now your main plan`);break;
  case 'del-plan':{const p=d.pid,nm=planName(p);commit(()=>{delete S.plans[p];S.order=S.order.filter(x=>x!==p);if(S.active===p)S.active=S.main;if(S.cart===p)S.cart=null;if(S.ai.plan===p){S.ai.plan=null;S.ai.items=[];}if(S.ai.goals.plan===p)S.ai.goals.plan=S.main;},`Deleted ${nm}`);break;}
  case 'send-cart':{const p=d.pid,prev=S.cart;commit(()=>{S.cart=p;S.main=p;},prev&&prev!==p?`${planName(p)} replaced ${planName(prev)} in your cart`:`${planName(p)} sent to your cart`);go('cart');break;}
  case 'cart-remove':commit(()=>{S.cart=null;},'Removed the plan from your cart');break;
  case 'ai-interest':{const g=S.ai.goals,i=g.interests.indexOf(d.t);if(i>=0)g.interests.splice(i,1);else g.interests.push(d.t);save();render();logEv('click','interest '+d.t);break;}
  case 'ai-generate':generate();ui.swap=null;save();render();logEv('action','AI suggestions generated: '+S.ai.items.length);toast(S.ai.items.length?`${S.ai.items.length} suggestions ready. Review each one.`:'Your plan already meets your goals.');break;
  case 'ai-clear':commit(()=>{S.ai.items=[];S.ai.plan=null;},'Cleared suggestions');break;
  case 'ai-accept':{const it=S.ai.items.find(x=>x.id==d.id),pid=S.ai.plan;clashBefore=clashes(mapOf(pid)).length+blockHits(mapOf(pid)).length;ui.swap=null;
    commit(()=>{const t=S.ai.items.find(x=>x.id==d.id);S.plans[pid].sections[t.cid]=t.sid;t.status='accepted';},`Accepted: ${it.kind==='add'?'added':'switched'} ${C[it.cid].code} ${it.sid} in ${planName(pid)}`,{checkClash:pid});break;}
  case 'ai-reject':{const it=S.ai.items.find(x=>x.id==d.id);ui.swap=null;commit(()=>{S.ai.items.find(x=>x.id==d.id).status='rejected';},`Rejected suggestion for ${C[it.cid].code}`);break;}
  case 'ai-undo':{const it=S.ai.items.find(x=>x.id==d.id),pid=S.ai.plan;commit(()=>{const t=S.ai.items.find(x=>x.id==d.id);
      if(t.status==='accepted'){if(t.kind==='add')delete S.plans[pid].sections[t.cid];else S.plans[pid].sections[t.cid]=t.from;}t.status='pending';},`Undid suggestion for ${C[it.cid].code}`);break;}
  case 'ai-swap':ui.swap=ui.swap==d.id?null:Number(d.id);render();break;
  case 'ai-pick':{if(el.getAttribute('aria-disabled')==='true'){toast(d.reason,{err:true});logErr('Picked conflicting AI alternative: '+d.reason);break;}
    commit(()=>{const t=S.ai.items.find(x=>x.id==d.id);t.cid=d.cid;t.sid=d.sid;t.edited=true;},`Changed the suggestion to ${C[d.cid].code} ${d.sid}`);ui.swap=null;render();break;}
  case 'mod-toggle':toggleMod();break;
  case 'mod':modAction(d.m,el);break;
  }}
document.addEventListener('click',e=>{
  if(!e.target.closest('#mod')&&LOG.current){const t=LOG.tasks[LOG.current];if(t&&!t.end){t.clicks++;saveLog();}}
  const el=e.target.closest('[data-action]');
  if(ui.menu&&!e.target.closest('.bar-right')){ui.menu=null;renderNav();}
  if(!el)return;
  if(el.tagName==='A')e.preventDefault();
  if(!e.target.closest('#mod'))logEv('click',(el.dataset.action)+(el.dataset.cid?' '+el.dataset.cid:'')+(el.dataset.sid?' '+el.dataset.sid:'')+(el.dataset.to?' → '+el.dataset.to:''));
  act(el.dataset.action,el,e);});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.filter){const k=el.dataset.filter;if(k in ui.f.req)ui.f.req[k]=el.checked;else ui.f[k]=el.checked;$('#results').innerHTML=resultsHtml();logEv('filter',k+'='+el.checked);return;}
  if(el.dataset.nyi){el.checked=false;notInPrototype(el.dataset.nyi);return;}
  if(el.dataset.goal){S.ai.goals[el.dataset.goal]=el.checked;save();logEv('filter','goal '+el.dataset.goal+'='+el.checked);return;}
  const c=el.dataset.change;if(!c)return;
  if(c==='term'){if(el.value!=='W27'&&!el.value.startsWith('Winter')){el.value=el.tagName==='SELECT'&&el.id==='termSel'?'W27':'Winter 2027';notInPrototype('Other terms');}return;}
  if(c==='sort'){ui.sort=el.value;$('#results').innerHTML=resultsHtml();return;}
  if(c==='active-plan'){S.active=el.value;save();render();return;}
  if(c==='cmp'){ui.cmp[Number(el.dataset.i)]=el.value;render();return;}
  if(c==='ai-plan'){S.ai.goals.plan=el.value;save();render();return;}
  if(c==='ai-credits'){S.ai.goals.credits=Number(el.value);save();render();return;}
  if(c==='ai-load'){S.ai.goals.workload=el.value;save();return;}
  if(c==='remind'){S.remind=el.checked;save();toast(el.checked?'Reminder set for 15 minutes before enrolment opens.':'Reminder turned off.');logEv('action','remind '+el.checked);return;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(ui.layer){ui.layer=null;renderLayer();}else if(ui.menu){ui.menu=null;renderNav();}}
  if(e.key==='M'&&e.shiftKey&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();toggleMod();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.day-tog')){/* native button handles */}
});

/* ================= STUDY TOOLS ================= */
let modOpen=false,tick=null;
function now(){return Date.now();}
function logEv(kind,detail){LOG.events.push({t:now(),task:LOG.current||'',kind,detail:String(detail||'')});if(LOG.events.length>3000)LOG.events.shift();saveLog();}
function logErr(detail){logEv('error',detail);if(LOG.current){const t=LOG.tasks[LOG.current];if(t&&!t.end){t.errors++;saveLog();}}if(modOpen)renderMod();}
function toggleMod(){modOpen=!modOpen;$('#mod').hidden=!modOpen;renderMod();if(modOpen&&!tick)tick=setInterval(()=>{if(modOpen&&LOG.current)updTimer();},500);}
function dur(t){return t.start?((t.end||now())-t.start)/1000:0;}
function mmss(s){s=Math.round(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updTimer(){const el=$('#modTimer');if(el&&LOG.current)el.textContent=mmss(dur(LOG.tasks[LOG.current]));}
function renderMod(){if(!modOpen)return;const cur=LOG.current,t=cur?LOG.tasks[cur]:null;
  const rows=[1,2,3,4].map(i=>{const x=LOG.tasks[i];return `<tr><td>T${i}</td><td class="tnum">${x&&x.start?mmss(dur(x)):'–'}</td><td>${x?(x.result||(x.end?'':'running')):''}</td><td class="tnum">${x?x.clicks:''}</td><td class="tnum">${x?x.errors:''}</td><td class="tnum">${x?x.assists:''}</td></tr>`;}).join('');
  $('#mod').innerHTML=`<div class="row"><h3>Study tools</h3><span class="spacer"></span><button class="mbtn" data-action="mod-toggle" aria-label="Close study tools">Hide (Shift+M)</button></div>
   <p style="margin:6px 0 10px;color:#AEB8CC">For the moderator and note-taker. Clicks and errors are counted automatically while a task runs.</p>
   <label for="modP" style="font-weight:800">Participant ID</label><input id="modP" value="${esc(LOG.participant)}" placeholder="e.g. P1-Instructor">
   <div class="row" style="margin:10px 0">${[1,2,3,4].map(i=>`<button class="mbtn ${cur==i?'on':''}" data-action="mod" data-m="start" data-i="${i}">Start T${i}</button>`).join('')}</div>
   ${t?`<div class="row"><span class="timer" id="modTimer">${mmss(dur(t))}</span><span>Task ${cur} ${t.end?'· ended':'· running'}</span></div>
    <div class="row" style="margin:8px 0">${t.end?'':`<button class="mbtn good" data-action="mod" data-m="end" data-r="success">Success</button><button class="mbtn" data-action="mod" data-m="end" data-r="partial">Partial</button><button class="mbtn bad" data-action="mod" data-m="end" data-r="fail">Fail / gave up</button>`}<button class="mbtn" data-action="mod" data-m="assist">Assist +1</button><button class="mbtn" data-action="mod" data-m="err">Error +1</button></div>`:'<p style="color:#AEB8CC">Pick a task to start timing.</p>'}
   <table><thead><tr><th>Task</th><th>Time</th><th>Result</th><th>Clicks</th><th>Errors</th><th>Assists</th></tr></thead><tbody>${rows}</tbody></table>
   <div class="row" style="margin-top:10px"><button class="mbtn" data-action="mod" data-m="copy-res">Copy results (CSV)</button><button class="mbtn" data-action="mod" data-m="copy-log">Copy event log (CSV)</button></div>
   <textarea id="modOut" hidden aria-label="Copied text"></textarea>
   <div class="row" style="margin-top:10px"><button class="mbtn" data-action="mod" data-m="reset-proto">Reset prototype</button><button class="mbtn" data-action="mod" data-m="clear-log">Clear study data</button></div>
   ${ui.modConfirm?`<p style="margin-top:8px;color:#F6DDCB"><b>${ui.modConfirm==='reset-proto'?'Reset all plans, blocks, cart and suggestions to the starting scenario?':'Delete all timings and the event log?'}</b></p><div class="row"><button class="mbtn bad" data-action="mod" data-m="confirm">Yes, ${ui.modConfirm==='reset-proto'?'reset':'delete'}</button><button class="mbtn" data-action="mod" data-m="cancel">Cancel</button></div>`:''}`;
  const p=$('#modP');p.addEventListener('input',()=>{LOG.participant=p.value;saveLog();});}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function copyText(txt,label){const out=$('#modOut');const done=()=>toast(label+' copied. Paste it into your notes or a spreadsheet.');
  try{navigator.clipboard.writeText(txt).then(done,()=>fallback());}catch(e){fallback();}
  function fallback(){out.hidden=false;out.value=txt;out.focus();out.select();toast('Select-all is done: press Ctrl+C (Cmd+C) to copy.');}}
function modAction(m,el){const d=el.dataset;
  if(m==='start'){const i=d.i;LOG.current=i;LOG.tasks[i]={start:now(),end:null,result:'',clicks:0,errors:0,assists:0};logEv('task','start T'+i);}
  else if(m==='end'&&LOG.current){const t=LOG.tasks[LOG.current];t.end=now();t.result=d.r;logEv('task','end T'+LOG.current+' '+d.r);}
  else if(m==='assist'&&LOG.current){LOG.tasks[LOG.current].assists++;logEv('assist','T'+LOG.current);}
  else if(m==='err'&&LOG.current){LOG.tasks[LOG.current].errors++;logEv('error','marked by note-taker');}
  else if(m==='copy-res'){const rows=[['participant','task','duration_s','result','clicks','errors','assists']];
    [1,2,3,4].forEach(i=>{const x=LOG.tasks[i];if(x)rows.push([LOG.participant,'T'+i,dur(x).toFixed(1),x.result||(x.end?'':'unfinished'),x.clicks,x.errors,x.assists]);});
    copyText(rows.map(r=>r.map(csvCell).join(',')).join('\n'),'Results');}
  else if(m==='copy-log'){const t0=LOG.events.length?LOG.events[0].t:0;const rows=[['participant','seconds','task','kind','detail']].concat(LOG.events.map(x=>[LOG.participant,((x.t-t0)/1000).toFixed(1),x.task?'T'+x.task:'',x.kind,x.detail]));
    copyText(rows.map(r=>r.map(csvCell).join(',')).join('\n'),'Event log');}
  else if(m==='reset-proto'||m==='clear-log'){ui.modConfirm=m;}
  else if(m==='cancel'){ui.modConfirm=null;}
  else if(m==='confirm'){if(ui.modConfirm==='reset-proto'){S=initState();hist.length=0;ui.layer=null;ui.swap=null;ui.detailSel={};ui.cmp=null;ui.q='';ui.f={req:{core3:false,core4:false,elec:false},fits:false,nofri:false,seats:false,elig:false,r4:false};save();render();toast('Prototype reset to the starting scenario.');}
    else{LOG=initLog();saveLog();toast('Study data cleared.');}ui.modConfirm=null;}
  saveLog();renderMod();}

render();
})();
</script>
