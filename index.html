<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>CoursePlanner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky navy app bar over a warm-grey workspace; each screen is a page of white panels.
   One light look on purpose (a single product UI for a usability test). Palette carried over from the Part I deck. */
:root{
  --bg:#ECE8DF; --surface:#FBFAF7; --surface-2:#F3F0E8; --ink:#1E2A44; --ink-2:#4A5266; --ink-3:#6B7180;
  --line:#D3CCBD; --line-2:#E4DFD3;
  --accent:#2456C7; --accent-deep:#1A3F96; --accent-soft:#DCE5F7; --on-accent:#FFFFFF;
  --warn:#A84812; --warn-soft:#F6DDCB; --ok:#2E6B45; --ok-soft:#D6EBDD; --neutral-soft:#E6E3DA;
  --nav:#1E2A44; --nav-ink:#E8ECF5; --nav-ink-2:#AEB8CC; --nav-hover:#2B3A5C;
  --focus:#E59A2F; --shadow:0 1px 2px rgba(30,42,68,.06),0 6px 20px rgba(30,42,68,.08);
  --font-display:'Rubik','Segoe UI',Arial,sans-serif;
  --font-body:'Nunito Sans','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.45;color:var(--ink);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--nav)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:28px;font-weight:600;line-height:1.15}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- App bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nav);color:var(--nav-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:18px;color:#fff;background:none;border:0;cursor:pointer;padding:4px 0;white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;color:var(--nav-ink-2);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav button:hover{background:var(--nav-hover);color:#fff}
.nav button[aria-current="page"]{color:#fff;background:var(--nav-hover);box-shadow:inset 0 -3px 0 var(--accent)}
.nav .ai-tag{font-size:11px;letter-spacing:.06em;border:1.5px dashed #9DB4EE;color:#C9D6F7;border-radius:5px;padding:0 5px}
.count{background:var(--accent);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.bar-right{display:flex;align-items:center;gap:6px;position:relative}
.term{background:var(--nav-hover);border:1px solid #3B4B70;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:8px;border:0;background:none;color:var(--nav-ink);cursor:pointer;display:grid;place-items:center;font-weight:800}
.icon-btn:hover{background:var(--nav-hover)}
.avatar{width:32px;height:32px;border-radius:50%;background:#C46A2E;color:#fff;display:grid;place-items:center;font-weight:800;border:0;cursor:pointer}
@media (max-width:820px){.bar-in{flex-wrap:wrap;height:auto;padding-block:8px;gap:6px 12px}.brand{flex:1}.nav{order:3;flex-basis:100%}.term{display:none}}
.menu{position:absolute;top:46px;right:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:240px;padding:6px;z-index:70}
.menu button,.menu .menu-item{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--surface-2)}
.menu .menu-head{padding:8px 12px 10px;border-bottom:1px solid var(--line-2);margin-bottom:4px}
.menu .muted{color:var(--ink-3);font-size:13px}

/* ---------- Page ---------- */
.wrap{max-width:1280px;margin:0 auto;padding-block:24px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sub{color:var(--ink-2);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--ink-3)}
.small{font-size:13px}
@media (max-width:900px){.grid-2{grid-template-columns:1fr}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);
  font-weight:800;padding:9px 16px;border-radius:9px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn-ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:10px}
.btn-ghost:hover{background:var(--accent-soft)}
.btn-sm{padding:6px 11px;font-size:14px;border-radius:8px}
.btn[aria-disabled="true"]{background:var(--neutral-soft);border:1.5px dashed #9AA0AC;color:#6B7180;cursor:not-allowed}
.btn-ai{border:1.5px dashed var(--accent);color:var(--accent);background:var(--surface)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.reason{font-size:13px;color:var(--warn);font-weight:700}

/* ---------- Pills, chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent-deep)}
.pill.neutral{background:var(--neutral-soft);color:var(--ink-2)}
.pill.ai{border:1.5px dashed var(--accent);color:var(--accent);background:var(--surface)}
.ai-tag-inline{font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--accent);border-radius:5px;padding:1px 6px}
.chip{width:12px;height:34px;border-radius:4px;flex:none}
.chip-sm{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.star{color:#9A6A08;font-weight:800}

/* ---------- Progress ---------- */
.pbar{display:flex;height:26px;border-radius:13px;overflow:hidden;border:1.5px solid var(--ink);background:var(--neutral-soft)}
.pbar .done{background:var(--accent)}
.pbar .plan{background:repeating-linear-gradient(45deg,#7E9DE6 0 8px,#C3D3F0 8px 16px)}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;color:var(--ink-2);font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--ink)}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.plan-card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.plan-card + .plan-card{margin-top:10px}
.kv{display:flex;flex-direction:column;gap:2px}
.kv b{font-family:var(--font-display);font-size:22px;font-weight:600}
.kv span{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:800}

/* ---------- Search ---------- */
.search-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.search-layout{grid-template-columns:1fr}}
.filters{position:sticky;top:76px;display:flex;flex-direction:column;gap:16px}
.filters fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.filters legend{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.check{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
details.more summary{cursor:pointer;font-weight:800;color:var(--accent)}
details.more[open] summary{margin-bottom:10px}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;padding:0 14px}
.searchbox input{flex:1;border:0;background:none;padding:12px 0;font-size:16px;outline:none;min-width:0}
.searchbox:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.results{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.course-card{display:flex;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.course-card:hover{border-color:var(--ink-3)}
.cc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cc-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.cc-title h3{font-size:17px}
.cc-line{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink-2)}
.cc-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;justify-content:center}
@media (max-width:640px){.course-card{flex-wrap:wrap}.cc-actions{flex-direction:row;width:100%;justify-content:flex-end}}
.elig{display:inline-flex;gap:6px;align-items:center;font-weight:800}
.elig.ok{color:var(--ok)}
.elig.no{color:var(--warn)}

/* ---------- Sections list ---------- */
.secs{display:flex;flex-direction:column;gap:10px}
.sec{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.sec.is-sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sec.is-off{background:var(--surface-2);border-style:dashed;border-color:#9AA0AC}
.sec-pick{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:0;padding:12px 14px;cursor:pointer;min-width:0;border-radius:10px}
.sec.is-off .sec-pick{cursor:not-allowed}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);flex:none;margin-top:2px;background:var(--surface)}
.sec.is-sel .radio{border:6px solid var(--accent)}
.sec.is-off .radio{border-color:#9AA0AC}
.sec-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.sec-top{font-weight:800}
.sec.is-off .sec-top,.sec.is-off .sec-sub{color:var(--ink-3)}
.sec-sub{font-size:14px;color:var(--ink-2)}
.sec-status{font-size:13.5px;font-weight:800}
.sec-status.ok{color:var(--ok)}.sec-status.warn{color:var(--warn)}.sec-status.info{color:var(--ink-2)}
.sec-side{display:flex;align-items:center;padding:0 14px;border-left:1px solid var(--line-2)}

/* ---------- Detail ---------- */
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
@media (max-width:900px){.detail-grid{grid-template-columns:1fr}}
.checklist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.checklist li{display:flex;gap:10px;align-items:flex-start}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;flex:none}
.mark.ok{background:var(--ok-soft);color:var(--ok)}
.mark.no{background:var(--warn-soft);color:var(--warn)}
.mark.warn{background:var(--warn-soft);color:var(--warn)}
.mark.info{background:var(--accent-soft);color:var(--accent-deep)}
.addbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line-2)}

/* ---------- Timetable ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;font-weight:800;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.metrics{display:flex;flex-wrap:wrap;gap:10px 28px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-radius:10px;border:1.5px solid var(--warn);background:var(--warn-soft)}
.banner .b-icon{width:26px;height:26px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.banner.info{border-color:var(--accent);background:var(--accent-soft)}
.banner.info .b-icon{background:var(--accent)}
.banner .b-text{flex:1;min-width:220px}
.tt-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tt{display:grid;grid-template-columns:58px repeat(5,minmax(110px,1fr));min-width:640px}
.tt-head{position:sticky;top:0;background:var(--surface);z-index:2;padding:10px 6px;text-align:center;font-weight:800;border-bottom:1.5px solid var(--line)}
.tt-head.fri{color:var(--ink-3)}
.tt-times{position:relative;border-right:1px solid var(--line-2)}
.tt-times span{position:absolute;right:8px;font-size:12px;color:var(--ink-3);transform:translateY(-50%)}
.tt-day{position:relative;border-right:1px solid var(--line-2);
  background-image:linear-gradient(to bottom,var(--line-2) 1px,transparent 1px);background-size:100% var(--px)}
.tt-day:last-child{border-right:0}
.blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:5px 7px;font-size:12.5px;line-height:1.25;overflow:hidden;cursor:pointer;border:0;text-align:left;
  border-left:5px solid var(--c);background:var(--cs);color:var(--ink)}
.blk b{display:block;font-size:13px}
.blk:hover{filter:brightness(.97);box-shadow:0 2px 8px rgba(30,42,68,.18)}
.blk.clash{background:repeating-linear-gradient(45deg,#F6DDCB 0 9px,#EFC3A2 9px 18px);border:2px solid var(--warn);border-left:5px solid var(--warn)}
.blk.hit{border:2px solid var(--warn);border-left:5px solid var(--warn)}
.blk .flag{display:inline-block;margin-bottom:2px;font-size:11px;font-weight:900;color:#fff;background:var(--warn);border-radius:4px;padding:0 5px}
.blk.ai{background:var(--surface);border:2px dashed var(--accent);color:var(--accent-deep);cursor:pointer}
.pblk{position:absolute;left:3px;right:3px;border-radius:7px;padding:5px 7px;font-size:12.5px;font-weight:800;
  background:repeating-linear-gradient(45deg,#D9D3C4 0 9px,#C9C1AE 9px 18px);color:var(--ink);display:flex;justify-content:space-between;gap:4px;overflow:hidden}
.pblk button{background:var(--surface);border:0;border-radius:5px;width:22px;height:22px;cursor:pointer;font-weight:900;flex:none}
.course-list{display:flex;flex-direction:column}
.cl-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.cl-row:last-child{border-bottom:0}
.cl-main{flex:1;min-width:200px}
.tt-mini .tt{min-width:0;grid-template-columns:22px repeat(5,1fr)}
.tt-mini .tt-head{padding:4px 2px;font-size:11px}
.tt-mini .blk{font-size:10px;padding:2px 3px;border-left-width:3px;cursor:default}
.tt-mini .blk b{font-size:10px}
.tt-mini .tt-times span{font-size:9px;right:3px}

/* ---------- Compare ---------- */
.cmp-head{display:grid;grid-template-columns:minmax(150px,1.1fr) 1fr 1fr;gap:12px;align-items:end}
.cmp th .select{font-size:15px;text-transform:none;letter-spacing:0;font-weight:800;color:var(--ink);max-width:220px;margin-left:auto;display:block}
.cmp td.better{font-weight:800;color:var(--ok)}
.cmp td.worse{color:var(--warn);font-weight:700}
.cmp-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.cmp-cols{grid-template-columns:1fr}}

/* ---------- Assistant ---------- */
.ai-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.ai-layout{grid-template-columns:1fr}}
.goal-chips{display:flex;flex-wrap:wrap;gap:8px}
.goal-chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;background:var(--surface);font-weight:800;cursor:pointer}
.goal-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sugg{border:2px dashed var(--accent);border-radius:12px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.sugg.accepted{border-style:solid;border-color:var(--ok);background:#F2F8F3}
.sugg.rejected{border-style:solid;border-color:var(--line);background:var(--surface-2)}
.sugg.rejected .sugg-title{text-decoration:line-through;color:var(--ink-3)}
.sugg-title{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:800;font-size:16px}
.sugg-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
@media (max-width:640px){.sugg-cols{grid-template-columns:1fr}}
.sugg h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sugg ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14px}
.sugg li{display:flex;gap:8px;align-items:flex-start}
.alts{border-top:1px solid var(--line-2);padding-top:12px;display:flex;flex-direction:column;gap:8px}

/* ---------- Layers ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,28,46,.45);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:81;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(20,28,46,.25);
  padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:flex-start}
.drawer-body{padding:18px 20px;overflow:auto;flex:1}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:14px;z-index:81;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal .drawer-head{border-radius:14px 14px 0 0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .lbl{font-weight:800;font-size:14px}
.field input[type=text],.field select{padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day-tog{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:800;cursor:pointer}
.day-tog[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.err{color:var(--warn);font-weight:800;font-size:14px}
.close{background:none;border:0;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:20px;color:var(--ink-2);flex:none}
.close:hover{background:var(--surface-2)}

/* ---------- Toast ---------- */
.toasts{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:stretch;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:11px 14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);width:100%}
.toast.err{background:var(--warn)}
.toast .t-msg{flex:1}
.toast button{background:none;border:0;color:#AFC4F5;font-weight:900;cursor:pointer;padding:4px 6px}
.toast.err button{color:#fff;text-decoration:underline}

/* ---------- Study tools ---------- */
.mod{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:95;width:min(380px,calc(100% - 24px));
  max-height:calc(100% - 100px);overflow:auto;background:#121A2C;color:#E8ECF5;border-radius:12px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:13.5px}
.mod h3{color:#fff;font-size:15px}
.mod input{width:100%;padding:7px 9px;border-radius:7px;border:1px solid #3B4B70;background:#1E2A44;color:#fff}
.mod .mbtn{background:#2B3A5C;border:1px solid #3B4B70;color:#fff;border-radius:7px;padding:6px 10px;font-weight:800;cursor:pointer}
.mod .mbtn:hover{background:#3B4B70}
.mod .mbtn.on{background:var(--accent);border-color:var(--accent)}
.mod .mbtn.good{background:#2E6B45;border-color:#2E6B45}
.mod .mbtn.bad{background:#A84812;border-color:#A84812}
.mod table{width:100%;border-collapse:collapse;font-size:12.5px}
.mod td,.mod th{padding:4px 5px;border-bottom:1px solid #2B3A5C;text-align:left}
.mod .timer{font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums}
.mod textarea{width:100%;height:90px;background:#1E2A44;color:#fff;border:1px solid #3B4B70;border-radius:7px;font-size:11px}
.foot{max-width:1280px;margin:0 auto;padding-block:0 28px;color:var(--ink-3);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.empty{padding:28px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line);border-radius:12px;background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>

const ENROL_OPENS='Mon, Dec 7 at 9:00 AM';
const INTEREST_LABEL={UX:'UX design',Data:'data',Web:'web development',Security:'security',Business:'business'};
const m=(d,s,e)=>({d,s,e});
const COURSES=[
 {id:'ITEC3220',code:'ITEC 3220',title:'Databases',cr:3,req:'core3',tags:['Data'],color:['#3949AB','#DADDF5'],

 {id:'ITEC3010',code:'ITEC 3010',title:'Systems Analysis and Design',cr:3,req:'core3',tags:['Business'],color:['#6B4BA8','#E5DCF3'],

  sections:[{id:'LEC M',meets:[m('Mon','10:00','11:30'),m('Wed','10:00','11:30')],prof:'Prof. R. Haddad',r:3.2,n:27,open:18,cap:90},

 {id:'ITEC3020',code:'ITEC 3020',title:'Web Technologies',cr:3,req:'core3',tags:['Web','UX'],color:['#0F7C8A','#CFEBEE'],

  sections:[{id:'LEC A',meets:[m('Tue','11:30','13:00'),m('Thu','11:30','13:00')],prof:'Prof. K. Patel',r:4.1,n:24,open:15,cap:100},
            {id:'LEC B',meets:[m('Thu','19:00','22:00')],prof:'Prof. L. Moreau',r:3.3,n:9,open:22,cap:60}]},
 {id:'ITEC3330',code:'ITEC 3330',title:'Interaction Design',cr:3,req:'core3',tags:['UX'],color:['#A23B72','#F2D8E6'],
  desc:'User research, prototyping and usability testing of interactive systems.',

            {id:'LEC B',meets:[m('Fri','10:00','13:00')],prof:'Prof. D. Bell',r:3.9,n:19,open:30,cap:60}]},
 {id:'ITEC3040',code:'ITEC 3040',title:'Information Security',cr:3,req:'core3',tags:['Security'],color:['#4A5A7A','#DFE4ED'],
  desc:'Threats, cryptography basics, access control and secure system design.',
  prereqs:[{code:'ITEC 2210',ok:true,note:'Completed (B)'}],restrict:'Open to ITEC majors',year:2,
  sections:[{id:'LEC A',meets:[m('Tue','14:30','16:00'),m('Thu','14:30','16:00')],prof:'Prof. N. Singh',r:2.8,n:46,open:50,cap:120},
            {id:'LEC B',meets:[m('Wed','18:00','21:00')],prof:'Prof. F. Ahmed',r:4.2,n:14,open:6,cap:40}]},
 {id:'ITEC4020',code:'ITEC 4020',title:'Web Systems Development',cr:3,req:'core4',tags:['Web'],color:['#3D5A80','#DCE3EE'],

 {id:'ITEC4010',code:'ITEC 4010',title:'Systems Analysis II',cr:3,req:'core4',tags:['Business'],color:['#5A5F8A','#E0E1EF'],

 {id:'ADMS2400',code:'ADMS 2400',title:'Introduction to Organizational Behaviour',cr:3,req:'elec',tags:['Business'],color:['#7A3E2E','#F0DED7'],
  desc:'How people and teams behave in organizations: motivation, leadership and culture.',

 {id:'MATH2560',code:'MATH 2560',title:'Elementary Statistics I',cr:3,req:'elec',tags:['Data'],color:['#8A5A00','#F3E6C8'],
  desc:'Descriptive statistics, probability, sampling and confidence intervals.',
  prereqs:[],restrict:'Open to all students',year:1,
  sections:[{id:'LEC A',meets:[m('Fri','13:00','16:00')],prof:'Prof. I. Ivanova',r:3.4,n:22,open:30,cap:150},
            {id:'LEC B',meets:[m('Mon','16:00','19:00')],prof:'Prof. W. Wu',r:2.9,n:31,open:12,cap:100}]},
 {id:'SOSC2350',code:'SOSC 2350',title:'Technology and Society',cr:3,req:'elec',tags:['Business'],color:['#5C6B1E','#E6EBCD'],
  desc:'How digital technology shapes work, privacy and public life.',
  prereqs:[],restrict:'Open to all students',year:1,
  sections:[{id:'LEC A',meets:[m('Wed','16:00','19:00')],prof:'Prof. P. Novak',r:4.4,n:17,open:20,cap:80}]}
];
const C={};COURSES.forEach(c=>{c.elig=c.prereqs.every(p=>p.ok)&&c.year<=2;C[c.id]=c;});
function eligReason(c){const p=c.prereqs.find(p=>!p.ok);if(p)return 'Needs '+p.code+' first';if(c.year>2)return 'Year 3 or higher only';return '';}

/* ================= STATE ================= */
const KEY='courseplanner-proto-v1', LOGKEY='courseplanner-study-v1';
function initState(){return{
  plans:{A:{name:'Plan A',sections:{ITEC3220:'LEC A',ITEC3010:'LEC M',ITEC3210:'LEC Q'}},
         B:{name:'Plan B',note:'Shared by a classmate',sections:{ITEC3220:'LEC A',ITEC3010:'LEC N',ITEC3210:'LEC A',ITEC3020:'LEC B',SOSC2350:'LEC A'}}},
  order:['A','B'],active:'A',main:'A',blocks:[],cart:null,remind:false,nextBlock:1,
  ai:{goals:{credits:15,noFri:true,keepBlocks:true,avoidFull:true,interests:['UX','Data'],workload:'Moderate',plan:'A'},plan:null,items:[],seq:1}
};}
let S=load(KEY)||initState();
let LOG=load(LOGKEY)||initLog();
function initLog(){return{participant:'',current:null,tasks:{},events:[]};}
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function saveLog(){try{localStorage.setItem(LOGKEY,JSON.stringify(LOG));}catch(e){}}
const ui={q:'',f:{req:{core3:false,core4:false,elec:false},fits:false,nofri:false,seats:false,elig:false,r4:false},sort:'fit',
  layer:null,menu:null,swap:null,detailSel:{},blockForm:null,cmp:null,pendingCart:null};
const hist=[];

/* ================= HELPERS ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>{const[h,mi]=t.split(':').map(Number);return h*60+mi;};
const fmt=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
const secOf=(cid,sid)=>C[cid]&&C[cid].sections.find(s=>s.id===sid);
function meetText(s){const g={};s.meets.forEach(x=>{const k=x.s+'–'+x.e;(g[k]=g[k]||[]).push(x.d);});
  return Object.entries(g).map(([k,d])=>d.join(', ')+' '+k).join(' · ');}
function ovl(a,b){return a.d===b.d&&tm(a.s)<tm(b.e)&&tm(b.s)<tm(a.e);}
function secOvl(s1,s2){const hits=[];s1.meets.forEach(a=>s2.meets.forEach(b=>{if(ovl(a,b))hits.push({d:a.d,s:Math.max(tm(a.s),tm(b.s))});}));return hits;}
function entries(map){return Object.entries(map).map(([cid,sid])=>({cid,sid,c:C[cid],s:secOf(cid,sid)})).filter(e=>e.c&&e.s);}
const mapOf=pid=>(S.plans[pid]||{sections:{}}).sections;
function clashes(map){const es=entries(map),out=[];for(let i=0;i<es.length;i++)for(let j=i+1;j<es.length;j++){const h=secOvl(es[i].s,es[j].s);if(h.length)out.push({a:es[i],b:es[j],hits:h});}return out;}
function blockOvl(s,b){return s.meets.filter(x=>b.days.includes(x.d)&&tm(x.s)<tm(b.e)&&tm(b.s)<tm(x.e)).map(x=>({d:x.d}));}
function blockHits(map){const out=[];entries(map).forEach(e=>S.blocks.forEach(b=>{const h=blockOvl(e.s,b);if(h.length)out.push({e,b,hits:h});}));return out;}
function fridays(map){return entries(map).filter(e=>e.s.meets.some(x=>x.d==='Fri'));}
function credits(map){return entries(map).reduce((t,e)=>t+e.c.cr,0);}
function daysOf(map){const d=new Set();entries(map).forEach(e=>e.s.meets.forEach(x=>d.add(x.d)));return DAYS.filter(x=>d.has(x));}
function dayMeets(map){const by={};entries(map).forEach(e=>e.s.meets.forEach(x=>{(by[x.d]=by[x.d]||[]).push([tm(x.s),tm(x.e)]);}));Object.values(by).forEach(a=>a.sort((p,q)=>p[0]-q[0]));return by;}
function longestGap(map){let g=0;Object.values(dayMeets(map)).forEach(a=>{let end=a[0]?a[0][1]:0;for(let i=1;i<a.length;i++){g=Math.max(g,a[i][0]-end);end=Math.max(end,a[i][1]);}});return g;}
function longestDay(map){let best={span:0,d:null};Object.entries(dayMeets(map)).forEach(([d,a])=>{const span=Math.max(...a.map(x=>x[1]))-a[0][0];if(span>best.span)best={span,d,s:a[0][0],e:Math.max(...a.map(x=>x[1]))};});return best;}
function avgRating(map){const es=entries(map);if(!es.length)return 0;return es.reduce((t,e)=>t+e.s.r,0)/es.length;}
function fulls(map){return entries(map).filter(e=>e.s.open<=0);}
function reqAdd(map){const r={};entries(map).forEach(e=>{r[e.c.req]=(r[e.c.req]||0)+e.c.cr;});return r;}
function fit(cid,sid,map){const s=secOf(cid,sid),hard=[],soft=[];
  entries(map).forEach(e=>{if(e.cid===cid)return;const h=secOvl(s,e.s);if(h.length)hard.push({t:'clash',e,h});});
  S.blocks.forEach(b=>{const h=blockOvl(s,b);if(h.length)hard.push({t:'block',b,h});});
  if(s.meets.some(x=>x.d==='Fri'))soft.push({t:'fri'});
  if(s.open<=0)soft.push({t:'full',wait:s.wait||0});
  return{hard,soft};}
function hardText(p){if(p.t==='clash')return 'Clashes with '+p.e.c.code+' '+p.e.sid+' · '+p.h[0].d+' '+fmt(p.h[0].s);
  return 'Overlaps your “'+p.b.label+'” time · '+p.h.map(x=>x.d).join(', ');}
function stars(s){return `<span class="star" aria-label="Instructor rating ${s.r} out of 5">★ ${s.r.toFixed(1)}</span> <span class="muted">(${s.n} ratings${s.n<10?' · few':''})</span>`;}
function seatText(s){return s.open>0?`${s.open} of ${s.cap} seats left`:`Full · waitlist ${s.wait||0}`;}
function chip(c,small){return `<span class="${small?'chip-sm':'chip'}" style="background:${c.color[0]}" aria-hidden="true"></span>`;}
function planName(pid){return S.plans[pid]?S.plans[pid].name:'';}
function snapshot(){hist.push(JSON.stringify(S));if(hist.length>40)hist.shift();}
function commit(fn,msg,opts){snapshot();fn();save();render();if(msg)toast(msg,{undo:true});logEv('action',msg||'change');if(opts&&opts.checkClash)checkNewClash(opts.checkClash);}
let clashBefore=0;
function checkNewClash(pid){const n=clashes(mapOf(pid)).length+blockHits(mapOf(pid)).length;if(n>clashBefore)logErr('Created a time conflict in '+planName(pid));}

/* ================= TOASTS ================= */
function toast(msg,o){o=o||{};const t=document.createElement('div');t.className='toast'+(o.err?' err':'');t.setAttribute('role',o.err?'alert':'status');
  t.innerHTML=`<span class="t-msg">${esc(msg)}</span>${o.undo&&hist.length?'<button data-action="undo">Undo</button>':''}<button data-action="toast-close" aria-label="Dismiss">✕</button>`;
  const box=$('#toasts');box.appendChild(t);while(box.children.length>2)box.firstChild.remove();
  setTimeout(()=>t.remove(),o.err?6000:5000);}
function notInPrototype(what){toast((what?what+': ':'')+'not part of this prototype.');logEv('click','non-functional: '+(what||''));}

/* ================= ROUTER ================= */
function route(){const h=(location.hash||'').slice(1);return h||'progress';}
function go(to){if(location.hash.slice(1)===to){render();return;}location.hash=to;}
window.addEventListener('hashchange',()=>{ui.layer=null;ui.menu=null;ui.swap=null;render();window.scrollTo(0,0);logEv('nav',route());});

/* ================= RENDER ================= */
function render(){renderNav();const r=route();let html='';
  if(r==='progress')html=vProgress();
  else if(r==='search')html=vSearch();
  else if(r.startsWith('course-')){const c=C[r.slice(7).toUpperCase()];html=c?vDetail(c):vNotFound();}
  else if(r==='timetable')html=vTimetable();
  else if(r==='compare')html=vCompare();
  else if(r==='assistant')html=vAssistant();
  else if(r==='cart')html=vCart();
  else html=vNotFound();
  $('#main').innerHTML=html;renderLayer();renderMod();
  if(r==='search')bindSearch();}
function renderNav(){const r=route();const cur=k=>(r===k||(k==='search'&&r.startsWith('course-')))?'aria-current="page"':'';
  const cartN=S.cart&&S.plans[S.cart]?entries(mapOf(S.cart)).length:0;
  $('#nav').innerHTML=`
   <button data-action="go" data-to="progress" ${cur('progress')}>Progress</button>
   <button data-action="go" data-to="search" ${cur('search')}>Search</button>
   <button data-action="go" data-to="timetable" ${cur('timetable')}>Timetable</button>
   <button data-action="go" data-to="compare" ${cur('compare')}>Compare</button>
   <button data-action="go" data-to="assistant" ${cur('assistant')}><span class="ai-tag">AI</span>Assistant</button>
   <button data-action="go" data-to="cart" ${cur('cart')}>Cart <span class="count tnum" aria-label="${cartN} courses">${cartN}</span></button>`;
  $('#barRight').innerHTML=`
   <label class="sr" for="termSel">Term</label>
   <select class="term" id="termSel" data-change="term"><option value="W27" selected>Winter 2027</option><option value="S27">Summer 2027</option><option value="F26" disabled>Fall 2026 (closed)</option></select>
   <button class="icon-btn" data-action="menu" data-menu="help" aria-label="Help" aria-expanded="${ui.menu==='help'}">?</button>
   <button class="icon-btn" data-action="menu" data-menu="bell" aria-label="Notifications" aria-expanded="${ui.menu==='bell'}">🔔</button>
   <button class="avatar" data-action="menu" data-menu="me" aria-label="Account menu for Bob Mitchell" aria-expanded="${ui.menu==='me'}">BM</button>
   ${ui.menu==='me'?`<div class="menu" role="menu"><div class="menu-head"><b>Bob Mitchell</b><div class="muted">BSc Information Technology · Year 2</div></div>
     <button role="menuitem" data-action="nyi" data-what="Profile">Profile</button><button role="menuitem" data-action="nyi" data-what="Settings">Settings</button>
     <button role="menuitem" data-action="nyi" data-what="Messages from my advisor">Messages from my advisor</button><button role="menuitem" data-action="nyi" data-what="Sign out">Sign out</button></div>`:''}
   ${ui.menu==='bell'?`<div class="menu" role="menu"><div class="menu-head"><b>Notifications</b></div>
     <div class="menu-item"><b>Winter 2027 enrolment</b><div class="muted">Opens ${ENROL_OPENS}. Have your cart ready.</div></div>
     <div class="menu-item"><b>New sample ratings</b><div class="muted">Instructor ratings were refreshed this week.</div></div></div>`:''}
   ${ui.menu==='help'?`<div class="menu" role="menu" style="min-width:300px"><div class="menu-head"><b>How CoursePlanner works</b></div>

/* ---------- Search ---------- */
function bestSecFor(c,map){return c.sections.map(s=>({s,f:fit(c.id,s.id,map)})).filter(x=>!x.f.hard.length);}
function searchResults(){const pid=S.active,map=mapOf(pid),q=ui.q.trim().toLowerCase().replace(/\s+/g,'');const f=ui.f;
  const reqOn=Object.keys(f.req).filter(k=>f.req[k]);
  let list=COURSES.filter(c=>{
    if(q&&!(c.code.toLowerCase().replace(/\s+/g,'').includes(q)||c.title.toLowerCase().replace(/\s+/g,'').includes(q)))return false;
    if(reqOn.length&&!reqOn.includes(c.req))return false;
    const fits=bestSecFor(c,map);
    if(f.fits&&!fits.length)return false;
    if(f.nofri&&!c.sections.some(s=>!s.meets.some(x=>x.d==='Fri')))return false;
    if(f.seats&&!c.sections.some(s=>s.open>0))return false;
    if(f.elig&&!c.elig)return false;
    if(f.r4&&!c.sections.some(s=>s.r>=4))return false;
    return true;});
  const top=c=>Math.max(...c.sections.map(s=>s.r));
  if(ui.sort==='code')list.sort((a,b)=>a.code.localeCompare(b.code));
  else if(ui.sort==='rating')list.sort((a,b)=>top(b)-top(a));
  else list.sort((a,b)=>score(a)-score(b));
  function score(c){return (c.elig?0:100)+(bestSecFor(c,map).length?0:20)+(map[c.id]?5:0)-top(c);}
  return list;}
function cardHtml(c){const pid=S.active,map=mapOf(pid),fits=bestSecFor(c,map),inPlan=map[c.id];
  const best=c.sections.slice().sort((a,b)=>b.r-a.r)[0];
  const elig=c.elig?`<span class="elig ok">✓ You can take this</span>`:`<span class="elig no">✗ ${esc(eligReason(c))}</span>`;
  const fitTxt=c.elig?(fits.length?`<span>${fits.length} of ${c.sections.length} section${c.sections.length>1?'s':''} fit ${esc(planName(pid))}</span>`:`<span class="reason">No section fits ${esc(planName(pid))}</span>`):'';
  let act;
  if(!c.elig)act=`<button class="btn btn-sm" aria-disabled="true" data-action="blocked" data-reason="${esc(c.code+': '+eligReason(c))}">+ Add</button>`;
  else if(inPlan)act=`<span class="pill ok">✓ In ${esc(planName(pid))} · ${esc(inPlan)}</span><button class="btn btn-sm" data-action="open-secs" data-cid="${c.id}">Change section</button>`;
  else act=`<button class="btn btn-primary btn-sm" data-action="open-secs" data-cid="${c.id}">+ Add to ${esc(planName(pid))}</button>`;
  return `<article class="course-card">${chip(c)}<div class="cc-body"><div class="cc-title"><h3>${c.code} · ${esc(c.title)}</h3><span class="muted small">${c.cr} credits</span></div>
    <div class="cc-line">${elig}<span>Counts toward <b>${REQ[c.req].name}</b></span></div>
    <div class="cc-line">${fitTxt}<span>Top instructor: ${esc(best.prof)} ${stars(best)}</span>${c.sections.some(s=>s.open<=0)?'<span class="pill warn">Full</span>':''}</div></div>
    <div class="cc-actions">${act}<button class="btn btn-ghost btn-sm" data-action="go" data-to="course-${c.id.toLowerCase()}">Details</button></div></article>`;}
function resultsHtml(){const list=searchResults();return `<p class="small muted tnum" id="resCount" aria-live="polite">${list.length} course${list.length===1?'':'s'} · Winter 2027</p>
  <div class="results">${list.length?list.map(cardHtml).join(''):`<div class="empty"><b>No courses match.</b><p class="small" style="margin-top:6px">Try removing a filter.</p><p style="margin-top:12px"><button class="btn btn-sm" data-action="clear-filters">Clear filters</button></p></div>`}</div>`;}
function vSearch(){const f=ui.f,ck=(id,on,label,extra)=>`<label class="check"><input type="checkbox" id="${id}" data-filter="${id}" ${on?'checked':''}><span>${label}${extra?`<br><span class="small muted">${extra}</span>`:''}</span></label>`;

      <input id="q" type="search" placeholder="Search by code or title, e.g. ITEC 3330 or design" value="${esc(ui.q)}" autocomplete="off"></div>

/* ---------- Section rows (shared) ---------- */
function secRow(c,s,pid,sel,current){const map=mapOf(pid),f=fit(c.id,s.id,map),off=f.hard.length>0;
  let status;
  if(off)status=`<span class="sec-status warn">✗ ${esc(f.hard.map(hardText).join('; '))}</span>`;
  else{const bits=[];if(f.soft.some(x=>x.t==='fri'))bits.push('Friday class');if(f.soft.some(x=>x.t==='full'))bits.push('Full · you would join the waitlist');
    status=`<span class="sec-status ${bits.length?'info':'ok'}">${bits.length?'⚠ ':'✓ '}${bits.length?esc(bits.join(' · ')):'Fits '+esc(planName(pid))}</span>`;}
  return `<div class="sec ${sel?'is-sel':''} ${off?'is-off':''}">
   <button type="button" class="sec-pick" role="radio" aria-checked="${sel}" ${off?'aria-disabled="true"':''} data-action="pick-sec" data-cid="${c.id}" data-sid="${s.id}" data-reason="${esc(f.hard.map(hardText).join('; '))}">
    <span class="radio" aria-hidden="true"></span><span class="sec-main"><span class="sec-top">${s.id} · ${meetText(s)} ${current?'<span class="pill neutral">Current</span>':''}</span>
    <span class="sec-sub">${esc(s.prof)} · ${stars(s)}</span><span class="sec-sub tnum">${seatText(s)}</span>${status}</span></button>
   <div class="sec-side"><button class="link small" data-action="rmp" data-prof="${esc(s.prof)}" aria-label="Open ${esc(s.prof)} on Rate My Professors">RMP ↗</button></div></div>`;}

/* ---------- Timetable ---------- */
const PX=44,T0=8*60,T1=22*60;
function lanes(items){items.sort((a,b)=>a.s-b.s);items.forEach(it=>{const grp=items.filter(o=>o.s<it.e&&it.s<o.e);it.n=grp.length;it.i=grp.indexOf(it);});return items;}
function gridHtml(map,opts){opts=opts||{};const px=opts.px||PX,mini=!!opts.mini;
  const clashSet=new Set(),hitSet=new Set();clashes(map).forEach(x=>{clashSet.add(x.a.cid);clashSet.add(x.b.cid);});blockHits(map).forEach(x=>hitSet.add(x.e.cid));
  const pend=opts.pending||[];
  const head='<div class="tt-head"></div>'+DAYS.map(d=>`<div class="tt-head ${d==='Fri'?'fri':''}">${mini?d[0]:d}</div>`).join('');
  const hours=[];for(let h=mini?10:9;h<=21;h+= mini?2:1)hours.push(`<span style="top:${(h*60-T0)/60*px}px">${mini?h:fmt(h*60)}</span>`);
  const cols=DAYS.map(d=>{let items=[];
    entries(map).forEach(en=>en.s.meets.filter(x=>x.d===d).forEach(x=>items.push({k:'c',en,s:tm(x.s),e:tm(x.e)})));
    pend.forEach(p=>{const s=secOf(p.cid,p.sid);s.meets.filter(x=>x.d===d).forEach(x=>items.push({k:'ai',p,s:tm(x.s),e:tm(x.e)}));});
    lanes(items);
    const blocks=items.map(it=>{const top=(it.s-T0)/60*px,h=(it.e-it.s)/60*px-2,w=100/it.n,left=`calc(${it.i*w}% + 3px)`,width=`calc(${w}% - 6px)`;
      if(it.k==='ai'){const c=C[it.p.cid];return `<button class="blk ai" style="top:${top}px;height:${h}px;left:${left};width:${width};right:auto" data-action="go" data-to="assistant" aria-label="Pending AI suggestion: ${c.code} ${it.p.sid}">${mini?'':'<span class="ai-tag-inline">AI</span>'}<b>${c.code}</b>${mini?'':it.p.sid+' · pending'}</button>`;}
      const e=it.en,c=e.c,cl=clashSet.has(e.cid),hit=hitSet.has(e.cid);
      return `<button class="blk ${cl?'clash':''} ${hit&&!cl?'hit':''}" style="--c:${c.color[0]};--cs:${c.color[1]};top:${top}px;height:${h}px;left:${left};width:${width};right:auto" ${mini?'tabindex="-1"':`data-action="open-secs" data-cid="${e.cid}"`} aria-label="${c.code} ${e.sid}, ${fmt(it.s)} to ${fmt(it.e)}${cl?', clash':''}${hit?', overlaps blocked time':''}">
        ${!mini&&cl?'<span class="flag">Clash</span>':''}${!mini&&hit&&!cl?'<span class="flag">Blocked time</span>':''}<b>${c.code}</b>${mini?'':(it.n>1?e.sid:`${e.sid} · ${fmt(it.s)}–${fmt(it.e)}`)}</button>`;}).join('');
    const pb=(opts.noBlocks?[]:S.blocks).filter(b=>b.days.includes(d)).map(b=>{const top=(tm(b.s)-T0)/60*px,h=(tm(b.e)-tm(b.s))/60*px-2;
      return `<div class="pblk" style="top:${top}px;height:${h}px;left:0;right:0;z-index:0"><span>${mini?'':esc(b.label)+' · '+b.s+'–'+b.e}</span>${mini?'':`<button data-action="del-block" data-id="${b.id}" aria-label="Remove ${esc(b.label)} on ${d}">✕</button>`}</div>`;}).join('');
    return `<div class="tt-day" style="height:${(T1-T0)/60*px}px;--px:${px}px">${pb}${blocks}</div>`;}).join('');
  return `<div class="tt">${head}<div class="tt-times" style="height:${(T1-T0)/60*px}px">${hours.join('')}</div>${cols}</div>`;}
function pendingFor(pid){return S.ai.plan===pid?S.ai.items.filter(x=>x.status==='pending').map(x=>({cid:x.cid,sid:x.sid})):[];}
function vTimetable(){const pid=S.active,P=S.plans[pid];if(!P){S.active=S.main;return vTimetable();}
  const map=P.sections,cl=clashes(map),bh=blockHits(map),fr=fridays(map),cr=credits(map),days=daysOf(map),pend=pendingFor(pid);
  const tabs=S.order.map(p=>`<button class="tab" role="tab" aria-selected="${p===pid}" data-action="set-active" data-pid="${p}">${esc(S.plans[p].name)}${p===S.main?' <span aria-label="main plan">★</span>':''}</button>`).join('');
  const cartReason=cl.length?`Fix ${cl.length} clash${cl.length>1?'es':''} before sending this plan to your cart.`:bh.length?`Move ${bh.length} class${bh.length>1?'es':''} out of your blocked time first.`:!cr?'Add at least one course first.':'';
  const banners=cl.map(x=>`<div class="banner" role="alert"><span class="b-icon">!</span><div class="b-text"><b>Time clash:</b> ${x.a.c.code} ${x.a.sid} overlaps ${x.b.c.code} ${x.b.sid} on ${[...new Set(x.hits.map(h=>h.d))].join(' & ')} at ${fmt(x.hits[0].s)}.</div>
      <button class="btn btn-sm" data-action="open-secs" data-cid="${x.b.cid}">Change ${x.b.c.code} section</button><button class="btn btn-sm" data-action="open-secs" data-cid="${x.a.cid}">Change ${x.a.c.code}</button></div>`).join('')
   +bh.map(x=>`<div class="banner" role="alert"><span class="b-icon">!</span><div class="b-text"><b>Blocked time:</b> ${x.e.c.code} ${x.e.sid} overlaps your “${esc(x.b.label)}” time on ${x.hits.map(h=>h.d).join(' & ')}.</div><button class="btn btn-sm" data-action="open-secs" data-cid="${x.e.cid}">Change section</button></div>`).join('')

/* ---------- Compare ---------- */
function vCompare(){if(!ui.cmp||!S.plans[ui.cmp[0]]||!S.plans[ui.cmp[1]])ui.cmp=[S.order[0],S.order[1]||S.order[0]];const[a,b]=ui.cmp,A=mapOf(a),B=mapOf(b),goal=S.ai.goals.credits;
  const sel=(i,v)=>`<label class="sr" for="cmp${i}">Plan ${i+1}</label><select id="cmp${i}" class="select" data-change="cmp" data-i="${i}">${S.order.map(p=>`<option value="${p}" ${p===v?'selected':''}>${esc(S.plans[p].name)}</option>`).join('')}</select>`;
  const ra=reqAdd(A),rb=reqAdd(B);
  const rows=[
   ['Credits',credits(A),credits(B),'near',goal,v=>v,'closer to your goal of '+goal],
   ['Days on campus',daysOf(A).length,daysOf(B).length,'low',0,(v,mp)=>v+' ('+(daysOf(mp).join(', ')||'none')+')','fewer'],
   ['Longest gap between classes',longestGap(A),longestGap(B),'low',0,v=>v?(v/60).toFixed(1)+' h':'none','shorter'],
   ['Time clashes',clashes(A).length,clashes(B).length,'low',0,v=>v,'fewer'],
   ['Overlaps with blocked time',blockHits(A).length,blockHits(B).length,'low',0,v=>v,'fewer'],
   ['Friday classes',fridays(A).length,fridays(B).length,'low',0,v=>v,'fewer'],
   ['Average instructor rating',+avgRating(A).toFixed(1),+avgRating(B).toFixed(1),'high',0,v=>v?v.toFixed(1)+' / 5':'–','higher'],
   ['Full sections (waitlist)',fulls(A).length,fulls(B).length,'low',0,v=>v,'fewer'],
   ['Core 3000-level credits added',ra.core3||0,rb.core3||0,'high',0,v=>'+'+v,'more']];
  let wa=0,wb=0;
  const body=rows.map(([lab,va,vb,kind,g,f,word])=>{let better=0;
    if(kind==='low'){if(va<vb)better=1;else if(vb<va)better=2;}
    else if(kind==='high'){if(va>vb)better=1;else if(vb>va)better=2;}
    else{const da=Math.abs(va-g),db=Math.abs(vb-g);if(da<db)better=1;else if(db<da)better=2;}
    if(better===1)wa++;if(better===2)wb++;
    const fa=f(va,A),fb=f(vb,B);
    return `<tr><td>${lab}</td><td class="num ${better===1?'better':better===2&&kind==='low'&&va>0?'worse':''}">${fa}${better===1?` <span class="small">(${word})</span>`:''}</td><td class="num ${better===2?'better':better===1&&kind==='low'&&vb>0?'worse':''}">${fb}${better===2?` <span class="small">(${word})</span>`:''}</td></tr>`;}).join('');
  const colFoot=(p,mp)=>{const r=clashes(mp).length?'Fix the clash first.':blockHits(mp).length?'A class overlaps your blocked time.':!credits(mp)?'This plan is empty.':'';
    return `<div class="row" style="justify-content:flex-end"><button class="btn btn-sm" data-action="open-plan" data-pid="${p}">Open in timetable</button>${p===S.main?'<span class="pill info">★ Main plan</span>':`<button class="btn btn-sm" data-action="make-main" data-pid="${p}">Make main plan</button>`}
      <button class="btn btn-primary btn-sm" ${r?`aria-disabled="true" data-action="blocked" data-reason="${esc(S.plans[p].name+': '+r)}"`:`data-action="send-cart" data-pid="${p}"`}>Send to cart</button></div>${r?`<p class="reason" style="text-align:right;margin-top:6px">${esc(r)}</p>`:''}`;};
  const noBlocks=!S.blocks.length?`<div class="banner info"><span class="b-icon">i</span><div class="b-text">You haven't blocked any personal time, so “Overlaps with blocked time” can't warn you about work or commuting.</div><button class="btn btn-sm" data-action="open-block">Block time</button></div>`:'';
  return `<div class="page-head"><div><p class="eyebrow">Compare</p><h1>Compare plans</h1><p class="sub">The better value in each row is labelled in green.</p></div></div>
   <div class="stack">${noBlocks}
    <section class="panel"><div class="tbl-wrap"><table class="tbl cmp"><thead><tr><th style="width:38%">Measure</th><th class="num">${sel(0,a)}</th><th class="num">${sel(1,b)}</th></tr></thead><tbody>${body}
     <tr><td><b>Better on</b></td><td class="num"><b>${wa} of ${rows.length}</b></td><td class="num"><b>${wb} of ${rows.length}</b></td></tr></tbody></table></div></section>
    <div class="cmp-cols"><section class="panel"><div class="panel-head"><h2>${esc(planName(a))}</h2><span class="small muted tnum">${credits(A)} credits</span></div><div class="tt-scroll tt-mini">${gridHtml(A,{px:14,mini:true})}</div><div style="margin-top:12px">${colFoot(a,A)}</div></section>
     <section class="panel"><div class="panel-head"><h2>${esc(planName(b))}</h2><span class="small muted tnum">${credits(B)} credits</span></div><div class="tt-scroll tt-mini">${gridHtml(B,{px:14,mini:true})}</div><div style="margin-top:12px">${colFoot(b,B)}</div></section></div>
   </div>`;}

/* ---------- AI assistant ---------- */
function interestMatch(c,g){return c.tags.filter(t=>g.interests.includes(t));}
function secOkForGoals(cid,sid,map,g){const s=secOf(cid,sid),f=fit(cid,sid,map);
  if(f.hard.some(p=>p.t==='clash'))return false;if(g.keepBlocks&&f.hard.some(p=>p.t==='block'))return false;
  if(g.noFri&&s.meets.some(x=>x.d==='Fri'))return false;if(g.avoidFull&&s.open<=0)return false;return true;}
function bestSecForGoals(c,map,g){const ok=c.sections.filter(s=>secOkForGoals(c.id,s.id,map,g)).sort((a,b)=>b.r-a.r);return ok[0]||null;}
function rankCandidates(map,g){const ra=reqAdd(map);return COURSES.filter(c=>c.elig&&!map[c.id]).map(c=>{const s=bestSecForGoals(c,map,g);if(!s)return null;
   const q=REQ[c.req],need=q.done+(ra[c.req]||0)<q.need;const sc=interestMatch(c,g).length*10+(need?(c.req==='core3'?4:3):0)+s.r;return{c,s,sc};}).filter(Boolean).sort((a,b)=>b.sc-a.sc);}
function generate(){const g=S.ai.goals,pid=g.plan,sim=JSON.parse(JSON.stringify(mapOf(pid)));const items=[];let n=1;
  clashes(sim).forEach(x=>{const mv=[x.b,x.a].find(e=>{const tmp=Object.assign({},sim);delete tmp[e.cid];return bestSecForGoals(e.c,tmp,g);});if(!mv)return;
    const tmp=Object.assign({},sim);delete tmp[mv.cid];const to=bestSecForGoals(mv.c,tmp,g);if(!to||sim[mv.cid]===to.id)return;
    const other=mv===x.a?x.b:x.a;items.push({id:n++,kind:'swap',cid:mv.cid,from:sim[mv.cid],sid:to.id,status:'pending',reason:`Fixes the clash with ${other.c.code} ${other.sid} on ${[...new Set(x.hits.map(h=>h.d))].join(' & ')} at ${fmt(x.hits[0].s)}`});sim[mv.cid]=to.id;});
  if(g.noFri)fridays(sim).forEach(e=>{const tmp=Object.assign({},sim);delete tmp[e.cid];const to=bestSecForGoals(e.c,tmp,g);if(!to)return;
    items.push({id:n++,kind:'swap',cid:e.cid,from:sim[e.cid],sid:to.id,status:'pending',reason:`Moves your Friday class to ${meetText(to)}, so you have no Friday classes`});sim[e.cid]=to.id;});
  if(g.keepBlocks)blockHits(sim).forEach(x=>{if(items.some(i=>i.cid===x.e.cid))return;const tmp=Object.assign({},sim);delete tmp[x.e.cid];const to=bestSecForGoals(x.e.c,tmp,g);if(!to)return;
    items.push({id:n++,kind:'swap',cid:x.e.cid,from:sim[x.e.cid],sid:to.id,status:'pending',reason:`Keeps your “${x.b.label}” time free`});sim[x.e.cid]=to.id;});
  const need=Math.max(0,g.credits-credits(sim));
  if(need>0){const k=Math.ceil(need/3)+1;rankCandidates(sim,g).slice(0,k).forEach(x=>items.push({id:n++,kind:'add',cid:x.c.id,sid:x.s.id,status:'pending'}));}
  S.ai.items=items;S.ai.plan=pid;S.ai.need=need;}
function suggWhy(it){const c=C[it.cid],s=secOf(it.cid,it.sid),g=S.ai.goals,out=[];
  if(it.kind==='swap'){out.push(it.reason);out.push(`${s.id} is taught by ${s.prof} (★ ${s.r.toFixed(1)}, ${s.n} ratings)`);return out;}
  const im=interestMatch(c,g);if(im.length)out.push('Matches your interest in '+im.map(t=>INTEREST_LABEL[t]).join(' and '));
  const q=REQ[c.req],ra=reqAdd(mapOf(S.ai.plan));out.push(`Counts toward ${q.name} (${q.done+(ra[c.req]||0)} of ${q.need} done)`);
  const better=c.sections.filter(x=>x.r>s.r);out.push(better.length?`${s.id} is the best-rated section that fits your goals`:`${s.id} has the best-rated instructor for this course`);
  if(it.edited)out.unshift('You picked this option');return out;}
function suggChecks(it){const pid=S.ai.plan,map=mapOf(pid),g=S.ai.goals,c=C[it.cid],s=secOf(it.cid,it.sid),f=fit(it.cid,it.sid,map),out=[];
  const cl=f.hard.filter(p=>p.t==='clash'),bl=f.hard.filter(p=>p.t==='block');
  out.push(cl.length?{k:'no',t:esc(cl.map(hardText).join('; '))}:{k:'ok',t:'No time clashes'});
  if(S.blocks.length)out.push(bl.length?{k:'no',t:esc(bl.map(hardText).join('; '))}:{k:'ok',t:'Keeps your blocked time free'});
  if(s.meets.some(x=>x.d==='Fri'))out.push({k:g.noFri?'no':'warn',t:'Friday class'+(g.noFri?' (you asked for none)':'')});else if(g.noFri)out.push({k:'ok',t:'No Friday classes'});
  if(s.open<=0)out.push({k:'warn',t:`Section is full · you would be waitlist #${(s.wait||0)+1}`});
  out.push(s.r<3.5?{k:'warn',t:`Instructor rated ${s.r.toFixed(1)}/5 (${s.n} ratings)`}:{k:'ok',t:`Instructor rated ${s.r.toFixed(1)}/5 (${s.n} ratings)`});
  if(it.kind==='add'&&it.status!=='accepted'){const after=credits(map)+c.cr;out.push(after>g.credits?{k:'warn',t:`Takes you to ${after} credits (your goal is ${g.credits})`}:{k:'ok',t:`Brings you to ${after} credits`});
    const tmp=Object.assign({},map,{[it.cid]:it.sid}),ld=longestDay(tmp);if(ld.span>8*60)out.push({k:'warn',t:`Makes ${DAY_LONG[ld.d]} a ${Math.round(ld.span/60)}-hour day (${fmt(ld.s)}–${fmt(ld.e)})`});}
  return out;}
function altsFor(it){const pid=S.ai.plan,map=mapOf(pid),g=S.ai.goals,out=[];const base=Object.assign({},map);if(it.kind==='swap')delete base[it.cid];
  C[it.cid].sections.forEach(s=>{if(s.id!==it.sid&&!(it.kind==='swap'&&s.id===it.from))out.push({cid:it.cid,sid:s.id});});
  if(it.kind==='add'){const taken=new Set(S.ai.items.filter(x=>x!==it&&x.status!=='rejected').map(x=>x.cid));
    rankCandidates(map,g).filter(x=>x.c.id!==it.cid&&!taken.has(x.c.id)).slice(0,3).forEach(x=>out.push({cid:x.c.id,sid:x.s.id}));}
  return out.map(o=>{const s=secOf(o.cid,o.sid),f=fit(o.cid,o.sid,it.kind==='swap'?base:map),notes=[];
    f.hard.forEach(p=>notes.push({k:'no',t:hardText(p)}));if(s.meets.some(x=>x.d==='Fri'))notes.push({k:g.noFri?'no':'warn',t:'Friday class'});if(s.r<3.5)notes.push({k:'warn',t:'Rated '+s.r.toFixed(1)});if(s.open<=0)notes.push({k:'warn',t:'Full'});
    return Object.assign(o,{s,notes,hard:f.hard.length>0});});}
function suggHtml(it){const c=C[it.cid],s=secOf(it.cid,it.sid),checks=suggChecks(it),hardNow=checks.some(x=>x.k==='no'&&/Clashes|Overlaps/.test(x.t));
  const title=it.kind==='add'?`Add ${c.code} ${esc(c.title)} · ${s.id}`:`Switch ${c.code} from ${it.from} to ${s.id}`;
  const li=a=>a.map(x=>`<li><span class="mark ${x.k||'info'}" aria-hidden="true">${x.k==='ok'?'✓':x.k==='no'?'✗':x.k==='warn'?'!':'i'}</span><span>${x.t||x}</span></li>`).join('');
  let actions;
  if(it.status==='accepted')actions=`<span class="pill ok">✓ Accepted · in ${esc(planName(S.ai.plan))}</span><span class="spacer"></span><button class="btn btn-ghost btn-sm" data-action="ai-undo" data-id="${it.id}">Undo</button>`;
  else if(it.status==='rejected')actions=`<span class="pill neutral">Rejected</span><span class="spacer"></span><button class="btn btn-ghost btn-sm" data-action="ai-undo" data-id="${it.id}">Undo</button>`;
  else actions=`<span class="spacer"></span><button class="btn btn-sm" data-action="ai-reject" data-id="${it.id}">Reject</button><button class="btn btn-sm" data-action="ai-swap" data-id="${it.id}" aria-expanded="${ui.swap===it.id}">${it.kind==='add'?'Swap for another…':'Pick another section…'}</button>
    <button class="btn btn-primary btn-sm" ${hardNow?`aria-disabled="true" data-action="blocked" data-reason="This suggestion now conflicts with your plan. Swap or reject it."`:`data-action="ai-accept" data-id="${it.id}"`}>Accept</button>`;
  const alts=ui.swap===it.id&&it.status==='pending'?`<div class="alts"><b class="small">Pick a different option. It replaces this suggestion; nothing is added until you accept.</b>${altsFor(it).map(a=>`<div class="sec ${a.hard?'is-off':''}"><button class="sec-pick" ${a.hard?'aria-disabled="true"':''} data-action="ai-pick" data-id="${it.id}" data-cid="${a.cid}" data-sid="${a.sid}" data-reason="${esc(a.notes.filter(n=>n.k==='no').map(n=>n.t).join('; '))}">
     <span class="radio" aria-hidden="true"></span><span class="sec-main"><span class="sec-top">${C[a.cid].code} ${a.cid===it.cid?'':esc(C[a.cid].title)} · ${a.sid}</span><span class="sec-sub">${meetText(a.s)} · ${esc(a.s.prof)} ${stars(a.s)}</span>
     <span class="sec-status ${a.notes.length?(a.hard?'warn':'info'):'ok'}">${a.notes.length?a.notes.map(n=>(n.k==='no'?'✗ ':'⚠ ')+esc(n.t)).join(' · '):'✓ Fits all your goals'}</span></span></button></div>`).join('')||'<p class="small muted">No other options fit.</p>'}</div>`:'';
  return `<article class="sugg ${it.status}" aria-label="Suggestion ${it.id}"><div class="sugg-title"><span class="ai-tag-inline">AI</span>${title}${it.edited?'<span class="pill neutral">Edited by you</span>':''}</div>
   <div class="small muted">${meetText(s)} · ${esc(s.prof)} ${stars(s)}</div>
   <div class="sugg-cols"><div><h4>Why</h4><ul>${li(suggWhy(it).map(t=>({k:'info',t:esc(t)})))}</ul></div><div><h4>Check</h4><ul>${li(checks)}</ul></div></div>
   <div class="row">${actions}</div>${alts}</article>`;}
function vAssistant(){const g=S.ai.goals,pid=g.plan,map=mapOf(pid);
  const chips=Object.keys(INTEREST_LABEL).map(t=>`<button class="goal-chip" aria-pressed="${g.interests.includes(t)}" data-action="ai-interest" data-t="${t}">${INTEREST_LABEL[t][0].toUpperCase()+INTEREST_LABEL[t].slice(1)}</button>`).join('');
  const ck=(k,label)=>`<label class="check"><input type="checkbox" data-goal="${k}" ${g[k]?'checked':''}><span>${label}</span></label>`;
  const items=S.ai.plan===pid?S.ai.items:[];const pend=items.filter(i=>i.status==='pending').length,acc=items.filter(i=>i.status==='accepted').length;
  const list=items.length?items.map(suggHtml).join(''):`<div class="empty"><b>No suggestions yet.</b><p class="small" style="margin-top:6px">Set your goals and choose <b>Suggest changes</b>. Nothing changes in your plan until you accept a suggestion.</p></div>`;
